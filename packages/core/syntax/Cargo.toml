[package]
name = "paredit-core-syntax"
description = "Lisp syntax kernel: parsing, dialects, Common Lisp forms, and definition shapes"
readme = "README.md"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# No anyhow. Section 9.2 finished here: every fallible entry point returns a
# thiserror enum, so a caller matches on a variant instead of a message.
thiserror.workspace = true
# East-Asian-Width–aware display-column counting for the formatter's inline-
# width budget. `no_std`-compatible and dependency-free itself, unlike anyhow;
# the "no anyhow" line above is about error handling, not a ban on every dep.
unicode-width.workspace = true

[dev-dependencies]
proptest.workspace = true

# Mandatory. Without it this package silently opts out of the workspace lint
# table, including `unsafe_code = "deny"`, with no error of any kind.
# crate_metadata_contract.rs checks every member for this line.
[lints]
workspace = true
