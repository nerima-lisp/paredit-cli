# Inherited from [workspace.lints] below, so the root package and every
# packages/*/* member are governed by one definition. A member that omits
# `[lints] workspace = true` silently loses `unsafe_code = "deny"` without any
# error, which is why a contract test checks every member for it.
[lints]
workspace = true

# The workspace sections are deliberately placed after [package].
# .github/workflows/release.yml reads the crate version with
#   sed -n 's/^version = "\([^"]*\)".*/\1/p' Cargo.toml | head -n1
# which takes the first column-0 `version =` line in the file. Keeping
# [package] first means that line stays the package version even though
# [workspace.package] declares one too. A contract test asserts the two agree,
# so a one-sided bump cannot ship a mismatched tag.
[workspace]
# Must stay a wildcard. crane cannot resolve sources for an omitted member, and
# an explicit list silently drops any package added without editing this line.
# Note that Cargo rejects a glob matching nothing, so this line can only exist
# while at least one packages/*/* member does.
members = ["packages/*/*"]
# `fuzz/` is a cargo-fuzz package: it needs a nightly toolchain and links
# libFuzzer, neither of which belongs in `cargo build --workspace` or the Nix
# build. It declares its own `[workspace]` as well, so this line is belt and
# braces — but the failure without it is "package is not included in the
# workspace", which stops every build rather than only the fuzz one.
#
# `xtask/` is dev-only tooling (see xtask/Cargo.toml): it is not part of the
# shipped binary or the analysis engine, so it should not have to satisfy the
# architecture contracts written for `packages/*/*`.
exclude = ["fuzz", "xtask"]

# Required, not cosmetic. This workspace has a root package, so a bare
# `cargo test` / `cargo nextest run` would otherwise build only the root and
# silently skip every member's unit tests - 272 of them at the first
# extraction, with no warning and a green result. flake.nix invokes nextest
# without `--workspace`, so the default member set is what CI actually runs.
default-members = [".", "packages/*/*"]

[workspace.package]
version = "1.4.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/nerima-lisp/paredit-cli"

# Single source of truth for dependency versions, so 26 members cannot drift
# apart. Verify with `cargo tree --duplicates` when adding one.
[workspace.dependencies]
blake3 = "1.8"
cap-std = "4.0"
clap = { version = "4.6", features = ["derive"] }
clap_complete = "4.5"
encoding_rs = "0.8"
libc = "0.2"
serde_json = "1.0"
thiserror = "2.0"
unicode-width = "0.2"
xattr = "1.6"
# dev-dependencies shared with members
proptest = "1.11"

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = "warn"
# Individually promoted after Phase -1 cleared every existing occurrence.
# `clippy::pedantic` is deliberately NOT enabled wholesale: it also carries
# lints this project rejects, such as `needless_pass_by_value`.
must_use_candidate = "warn"
semicolon_if_nothing_returned = "warn"
uninlined_format_args = "warn"
# Nursery lint, kept because it guards the `const fn` signatures added in
# Phase -1. Its two cfg-dependent false positives carry a local `allow`.
missing_const_for_fn = "warn"
