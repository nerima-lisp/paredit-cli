[package]
name = "paredit-feature-lisp-analysis"
description = "Reports for the parts of Common Lisp that live outside the evaluator: reader syntax, the loop grammar, format control strings, CLOS dispatch, and the condition system"
readme = "README.md"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
paredit-core-syntax = { path = "../../core/syntax" }
paredit-core-cli = { path = "../../core/cli" }
anyhow = { workspace = true }
clap = { workspace = true }
serde_json = { workspace = true }

# Mandatory: without it this package silently opts out of the workspace lint
# table, including `unsafe_code = "deny"`.
[lints]
workspace = true
