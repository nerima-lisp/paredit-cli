name: CI

on:
  pull_request:
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Verify
    # `nix flake check` builds 11 derivations, several of which compile the
    # whole 24-package workspace under a different toolchain or flag set. It
    # took 26m56s here on a warm Cachix cache; a cold cache (any commit whose
    # source hash Cachix has not seen) exceeds 30 minutes and the job is
    # cancelled mid-check, which reads as a spurious failure. 60 leaves room
    # for a cold run without letting a genuinely hung build burn an hour.
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/nix-setup
        with:
          cachix-cache: ${{ vars.CACHIX_CACHE }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Run host-specific flake checks
        run: nix flake check

  supply-chain:
    name: Supply-chain audit
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/nix-setup
        with:
          cachix-cache: ${{ vars.CACHIX_CACHE }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Reject vulnerable or unmaintained dependencies
        run: nix develop --command cargo audit --deny warnings
