name: Update flake.lock

on:
  schedule:
    - cron: "0 4 * * 1" # 04:00 UTC every Monday
  workflow_dispatch:

permissions:
  contents: write # Push the update branch.
  pull-requests: write # Open the update PR.

# Serialize a manual dispatch that overlaps the weekly schedule, so the two
# runs cannot open competing update PRs.
concurrency:
  group: flake-update
  cancel-in-progress: false

jobs:
  update:
    name: Update flake inputs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Unlike ci.yml/docs.yml, this checkout does NOT set
      # persist-credentials: false: this job needs the token to push the
      # update branch and open the PR.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      # Reuse the shared installer wiring (Cachix self-skips with no cache set),
      # keeping the nix-installer SHA pin in exactly one place.
      - uses: ./.github/actions/nix-setup

      # Opens/refreshes a PR bumping every flake input.
      #
      # NOTE: this uses the default GITHUB_TOKEN, so GitHub will NOT trigger CI
      # on the bot's PR (loop-prevention). Re-run CI by pushing an empty commit
      # or closing and reopening the PR; swap in a PAT via `token:` if
      # self-triggering CI is required.
      - name: Update flake.lock
        uses: DeterminateSystems/update-flake-lock@834c491b2ece4de0bbd00d85214bb5e83b4da5c6 # v28
        with:
          pr-title: "chore: update flake.lock"
          commit-msg: "chore: update flake.lock"
