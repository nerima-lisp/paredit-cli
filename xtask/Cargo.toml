# Excluded from the root workspace on purpose, the same way fuzz/ is:
# `[workspace]` below makes this its own root, so `cargo build --workspace`
# and the Nix package/clippy/nextest checks never compile it, and it never
# has to satisfy the analysis engine's `[lints] workspace = true` /
# domain-never-depends-on-clap contracts that `tests/cli/architecture_contract.rs`
# enforces on `packages/*/*` — this crate's entire purpose is a CLI.
#
# It still builds under plain `cargo build` from `nix develop`, and `.cargo/
# config.toml` makes it reachable as `cargo xtask <command>` from the repo
# root.
[package]
name = "xtask"
version = "0.0.0"
publish = false
edition = "2024"

[workspace]

[dependencies]
clap = { version = "4.6", features = ["derive"] }
# `new-lint-rule --from-custom-rule` reuses this crate's `.paredit/rules/*.lisp`
# reader (packages/feature/lint-custom/src/ruleset.rs) rather than parsing Lisp
# a second time. This is a path dependency into the *main* workspace from
# xtask's own separate one — a package can be a member of only one workspace,
# but that is about `cargo build --workspace`/member lists, not about who may
# depend on it by path, so this builds cleanly under both workspaces' own
# `cargo build`.
paredit-feature-lint-custom = { path = "../packages/feature/lint-custom" }
# `seed_examine_notes` renders a seeded `:pattern`/`:fix` back to Lisp text for
# the generated doc comment. `Template::text()` covers the `:fix` half, but
# `Pattern` (unlike `Template`) does not retain its source text — parsing it
# discards reader-prefix and whitespace detail on purpose, since matching
# never needs it back — so rendering a `Pattern` needs this crate's own
# `Pattern`/`CaptureKind`/`Rest` types directly, not just the `pattern::`
# facade `paredit-feature-lint-custom` re-exports.
paredit-core-syntax = { path = "../packages/core/syntax" }
