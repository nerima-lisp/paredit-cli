[package]
name = "paredit-core-cli"
description = "CLI I/O conventions: input, diffing, atomic writes, and shared argument types"
readme = "README.md"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
paredit-core-syntax = { path = "../syntax" }
paredit-core-semantics = { path = "../semantics" }
paredit-core-edit = { path = "../edit" }
paredit-core-workspace = { path = "../workspace" }
paredit-core-lint-engine = { path = "../lint-engine" }
paredit-core-safety = { path = "../safety" }
# anyhow stays, for two things only: gate_failure builds a type-erased marker
# that the dispatch layer downcasts, and terminal_safe_error_chain renders an
# anyhow chain for the terminal. Both are boundary helpers for a `main` that
# returns anyhow::Result. Everything else here is CliError - see src/error.rs.
anyhow.workspace = true
blake3.workspace = true
cap-std.workspace = true
clap.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true
xattr.workspace = true

[dev-dependencies]
proptest.workspace = true

# Mandatory: without it this package silently opts out of the workspace lint
# table, including `unsafe_code = "deny"`, with no error at all.
[lints]
workspace = true
