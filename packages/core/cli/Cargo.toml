[package]
name = "paredit-core-cli"
description = "CLI I/O conventions: input, diffing, atomic writes, and shared argument types"
readme = "README.md"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
paredit-core-syntax = { path = "../syntax" }
paredit-core-semantics = { path = "../semantics" }
paredit-core-edit = { path = "../edit" }
paredit-core-workspace = { path = "../workspace" }
paredit-core-lint-engine = { path = "../lint-engine" }
paredit-core-safety = { path = "../safety" }
# No anyhow. The two holdouts it was kept for are gone: `gate_failure` used to
# build a type-erased marker for the dispatch layer to `downcast`, and it now
# returns a `CommandFailure` variant; `terminal_safe_error_chain` used to
# render an anyhow chain, and now takes `&dyn Error` and walks `source()`
# itself. See `CommandFailure` in src/error.rs.
blake3.workspace = true
cap-std.workspace = true
clap.workspace = true
encoding_rs.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true
xattr.workspace = true

[dev-dependencies]
proptest.workspace = true

# Mandatory: without it this package silently opts out of the workspace lint
# table, including `unsafe_code = "deny"`, with no error at all.
[lints]
workspace = true
