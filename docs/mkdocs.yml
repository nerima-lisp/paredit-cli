# paredit-cli documentation — MkDocs + Material configuration.
#
# Build:   mkdocs build -f docs/mkdocs.yml --strict
# Serve:   mkdocs serve  -f docs/mkdocs.yml
# The Nix flake (`nix build .#docs`) drives the same config offline.

site_name: paredit-cli
site_description: >-
  Structure-editing CLI for safe S-expression refactoring, built for both
  people and AI coding agents.
site_author: paredit-cli contributors
site_url: https://nerima-lisp.github.io/paredit-cli/

repo_name: nerima-lisp/paredit-cli
repo_url: https://github.com/nerima-lisp/paredit-cli
edit_uri: edit/main/docs/src/

# Content lives in docs/src (kept from the previous mdBook layout).
docs_dir: src
site_dir: ../site
use_directory_urls: true

copyright: Copyright &copy; paredit-cli contributors — MIT License

# Also passed as --strict by the flake's mkDocs derivation. Writing it here as
# well means `mkdocs serve` applies the same gate, so no invocation path
# silently tolerates a broken link. Use `mkdocs serve --no-strict` while
# editing.
strict: true

theme:
  name: material
  language: en
  icon:
    repo: fontawesome/brands/github
    logo: material/code-parentheses
  favicon: assets/favicon.svg
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to system preference
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.action.edit

extra_css:
  - assets/stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/nerima-lisp/paredit-cli
      name: paredit-cli on GitHub
  generator: false

plugins:
  - search

markdown_extensions:
  # Callouts / admonitions.
  - admonition
  - pymdownx.details
  # Code blocks: syntax highlighting, line numbers, inline highlighting.
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  # pymdownx.snippets is deliberately absent: its only use in this org was
  # including the top-level CHANGELOG.md, and the 2026-08-01 revision
  # abolished CHANGELOG.md. Leaving the extension configured invites a new use.
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  # Content tabs (e.g. the Nix run / profile / local-checkout install paths).
  - pymdownx.tabbed:
      alternate_style: true
  # Task lists, key bindings, smart symbols, emoji.
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.keys
  - pymdownx.smartsymbols
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - attr_list
  - md_in_html
  - def_list
  - footnotes
  - tables
  - toc:
      permalink: true
      title: On this page

# Every page under docs/src/ must appear here: --strict fails the build on an
# unlisted page. The five sections and the guide/ reference/ project/ split are
# fixed by the 2026-08-01 revision of DOCS_STANDARD.md; only index.md,
# getting-started.md and assets/ stay at the root of docs/src/.
#
# `reference/api.md` is the CLI subcommand reference. paredit-cli ships an
# executable rather than a library, and DOCS_STANDARD.md names this repository
# explicitly: the mandatory `reference/api.md` holds the subcommand list.
#
# The Contributing section is gone. Its community-health pages duplicated the
# org defaults in nerima-lisp/.github and were deleted; the maintainer release
# checklist moved to docs/notes/releasing.md, which is outside docs_dir because
# its reader is a maintainer rather than a user.
nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Guide:
      - Refactor Workflow: guide/workflows.md
      - Safety Reference: guide/safety.md
      - Agent Interface: guide/agents.md
      - Integrations: guide/integrations.md
  - Reference:
      - API: reference/api.md
      - Selecting Forms: reference/selectors.md
      - Choosing Files: reference/workspace-inputs.md
      - Configuration: reference/configuration.md
      - Error Codes: reference/errors.md
      - Architecture: reference/architecture.md
      - Compatibility: reference/compatibility.md
  - Project:
      - Development: project/development.md
      - Feature Candidates: project/feature-candidates.md

not_in_nav: |
  notes/
