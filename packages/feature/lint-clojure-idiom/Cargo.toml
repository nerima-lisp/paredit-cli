[package]
name = "paredit-feature-lint-clojure-idiom"
description = "Lint rules for Clojure idiom: laziness across a resource scope, call-time Var interning, nested-path arity, and spread literals"
readme = "README.md"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
paredit-core-syntax = { path = "../../core/syntax" }
paredit-core-lint-engine = { path = "../../core/lint-engine" }
paredit-core-cli = { path = "../../core/cli" }
clap.workspace = true
serde_json.workspace = true

# Mandatory: without it this package silently opts out of the workspace lint
# table, including `unsafe_code = "deny"`, with no error at all.
[lints]
workspace = true
