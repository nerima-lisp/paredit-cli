[package]
name = "paredit-cli"
version = "1.2.1"
edition = "2024"
publish = false
rust-version = "1.85"
license = "MIT"
description = "Structure-editing CLI for safe S-expression refactoring by AI coding agents"
repository = "https://github.com/nerima-lisp/paredit-cli"
homepage = "https://github.com/nerima-lisp/paredit-cli"
documentation = "https://nerima-lisp.github.io/paredit-cli/"
readme = "README.md"
keywords = ["lisp", "paredit", "refactoring", "cli", "sexp"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "paredit"
path = "src/main.rs"

[profile.release]
lto = "fat"
codegen-units = 1

# The dev profile is what `clippy --all-targets` and `cargo nextest run` build,
# in CI and locally. Full DWARF for 25 member crates plus the ~240-module
# `tests/cli.rs` integration binary dominates link time and buys nothing that a
# panic backtrace uses: line tables still resolve every frame to `file:line`,
# which is the only debug information the test suite ever reports from.
# Step-debugging a specific crate is still available with `RUSTFLAGS=-Cdebuginfo=2`.
[profile.dev]
debug = "line-tables-only"

[dependencies]
# Extracted core packages (Phase 1 onwards).
paredit-core-syntax = { path = "packages/core/syntax" }
paredit-core-semantics = { path = "packages/core/semantics" }
paredit-core-edit = { path = "packages/core/edit" }
paredit-core-lint-engine = { path = "packages/core/lint-engine" }
paredit-core-cli = { path = "packages/core/cli" }
paredit-core-config = { path = "packages/core/config" }
paredit-core-jsonrpc = { path = "packages/core/jsonrpc" }
paredit-feature-similarity = { path = "packages/feature/similarity" }
paredit-feature-structural-diff = { path = "packages/feature/structural-diff" }
paredit-feature-extract = { path = "packages/feature/extract" }
paredit-feature-inline = { path = "packages/feature/inline" }
paredit-feature-form-transform = { path = "packages/feature/form-transform" }
paredit-core-workspace = { path = "packages/core/workspace" }

paredit-feature-binding = { path = "packages/feature/binding" }
paredit-feature-change-summary = { path = "packages/feature/change-summary" }
paredit-feature-function-parameter = { path = "packages/feature/function-parameter" }
paredit-feature-package = { path = "packages/feature/package" }
paredit-feature-remove-unused = { path = "packages/feature/remove-unused" }
paredit-feature-rename = { path = "packages/feature/rename" }
paredit-feature-project-analysis = { path = "packages/feature/project-analysis" }
paredit-feature-code-metrics = { path = "packages/feature/code-metrics" }
paredit-feature-lisp-analysis = { path = "packages/feature/lisp-analysis" }
paredit-feature-project-inventory = { path = "packages/feature/project-inventory" }
paredit-feature-semantic-report = { path = "packages/feature/semantic-report" }
paredit-feature-selector = { path = "packages/feature/selector" }
paredit-feature-refactor-workflow = { path = "packages/feature/refactor-workflow" }
paredit-feature-lint-string-char = { path = "packages/feature/lint-string-char" }
paredit-feature-lint-control-flow = { path = "packages/feature/lint-control-flow" }
paredit-feature-lint-numeric = { path = "packages/feature/lint-numeric" }
paredit-feature-lint-sequence = { path = "packages/feature/lint-sequence" }
paredit-feature-lint-conditional = { path = "packages/feature/lint-conditional" }
paredit-feature-lint-form-shape = { path = "packages/feature/lint-form-shape" }
paredit-feature-lint-performance = { path = "packages/feature/lint-performance" }
paredit-feature-lint-portability = { path = "packages/feature/lint-portability" }
paredit-feature-lint-safety = { path = "packages/feature/lint-safety" }
paredit-feature-lint-convention = { path = "packages/feature/lint-convention" }
paredit-feature-lint-custom = { path = "packages/feature/lint-custom" }
paredit-feature-emacs-lisp = { path = "packages/feature/emacs-lisp" }
paredit-feature-conditional-conversion = { path = "packages/feature/conditional-conversion" }
anyhow = "1.0"
blake3 = "1.8"
cap-std = "4.0"
clap = { version = "4.6", features = ["derive"] }
clap_complete = "4.5"
libc = "0.2"
serde_json = "1.0"
thiserror = "2.0"

[target.'cfg(unix)'.dependencies]
xattr = "1.6"

[dev-dependencies]
assert_cmd = "2.2"
criterion = "0.5.1"
predicates = "3.1"
proptest = "1.11"

[[bench]]
name = "similarity_report"
harness = false

[[bench]]
name = "lint_report"
harness = false

# Inherited from [workspace.lints] below, so the root package and every
# packages/*/* member are governed by one definition. A member that omits
# `[lints] workspace = true` silently loses `unsafe_code = "deny"` without any
# error, which is why a contract test checks every member for it.
[lints]
workspace = true

# The workspace sections are deliberately placed after [package].
# .github/workflows/release.yml reads the crate version with
#   sed -n 's/^version = "\([^"]*\)".*/\1/p' Cargo.toml | head -n1
# which takes the first column-0 `version =` line in the file. Keeping
# [package] first means that line stays the package version even though
# [workspace.package] declares one too. A contract test asserts the two agree,
# so a one-sided bump cannot ship a mismatched tag.
[workspace]
# Must stay a wildcard. crane cannot resolve sources for an omitted member, and
# an explicit list silently drops any package added without editing this line.
# Note that Cargo rejects a glob matching nothing, so this line can only exist
# while at least one packages/*/* member does.
members = ["packages/*/*"]

# Required, not cosmetic. This workspace has a root package, so a bare
# `cargo test` / `cargo nextest run` would otherwise build only the root and
# silently skip every member's unit tests - 272 of them at the first
# extraction, with no warning and a green result. flake.nix invokes nextest
# without `--workspace`, so the default member set is what CI actually runs.
default-members = [".", "packages/*/*"]

[workspace.package]
version = "1.2.1"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/nerima-lisp/paredit-cli"

# Single source of truth for dependency versions, so 26 members cannot drift
# apart. Verify with `cargo tree --duplicates` when adding one.
[workspace.dependencies]
anyhow = "1.0"
blake3 = "1.8"
cap-std = "4.0"
clap = { version = "4.6", features = ["derive"] }
clap_complete = "4.5"
libc = "0.2"
serde_json = "1.0"
thiserror = "2.0"
xattr = "1.6"
# dev-dependencies shared with members
proptest = "1.11"

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = "warn"
# Individually promoted after Phase -1 cleared every existing occurrence.
# `clippy::pedantic` is deliberately NOT enabled wholesale: it also carries
# lints this project rejects, such as `needless_pass_by_value`.
must_use_candidate = "warn"
semicolon_if_nothing_returned = "warn"
uninlined_format_args = "warn"
# Nursery lint, kept because it guards the `const fn` signatures added in
# Phase -1. Its two cfg-dependent false positives carry a local `allow`.
missing_const_for_fn = "warn"
