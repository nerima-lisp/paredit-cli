[package]
name = "paredit-feature-lint-hy-lfe-idiom"
description = "Lint rules for Hy and LFE idiom, where each language's defects are the host language's defects wearing Lisp syntax"
readme = "README.md"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
paredit-core-syntax = { path = "../../core/syntax" }
paredit-core-lint-engine = { path = "../../core/lint-engine" }

# No feature-package dependency, dev or otherwise. The cost measurement in the
# report was taken with a temporary dev-dependency on the lint-control-flow and
# lint-elisp-idiom packages, so that a shipped rule could be timed in the *same*
# pass; it was removed again because a feature-to-feature edge needs an entry in
# the dependency allowlist contract, and a scratch benchmark does not earn one.
#
# Those two are named by directory rather than by crate name on purpose:
# `tests/cli/feature_dependency_contract.rs` scans this file as whole text
# rather than parsing it, so the crate-name prefix appearing anywhere in it —
# a comment included — reads as a declared edge and fails the contract.

# Mandatory: without it this package silently opts out of the workspace lint
# table, including `unsafe_code = "deny"`, with no error at all.
[lints]
workspace = true
