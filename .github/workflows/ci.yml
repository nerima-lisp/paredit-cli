name: CI

on:
  # `push: branches: [main]` is declared here rather than in a separate
  # main.yml that called this workflow through `workflow_call`. That wrapper was
  # a fifth workflow whose only job was to re-trigger this one, and the org
  # standard allows exactly ci.yml / docs.yml / release.yml / flake-update.yml
  # unless a file states why its work cannot run inside the Nix sandbox — which
  # a re-trigger cannot. Triggering directly also removes the `secrets:` block
  # the wrapper needed: a workflow reached by `push` reads
  # `secrets.CACHIX_AUTH_TOKEN` from the repository without it being forwarded,
  # and forwarding an undeclared name is what used to fail every push to main
  # with no jobs and no logs.
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Evaluation gate and matrix source in one job.
  #
  # `nix flake check --no-build` instantiates every output for this host -
  # packages, apps, devShells, overlays, formatter and the checks themselves -
  # without building any of them, so the structural verification a plain
  # `nix flake check` used to provide survives the fan-out below at a cost of
  # seconds rather than half an hour.
  #
  # The matrix is then read out of the flake instead of being restated here. A
  # check added to `mkCoreChecks` is verified by the next run with no edit to
  # this file, and the `checks.{default,formatting,docs}` conformance aliases -
  # which are duplicate store paths, not extra work - stay out of it.
  plan:
    name: Evaluate flake
    timeout-minutes: 15
    runs-on: ubuntu-latest
    outputs:
      checks: ${{ steps.enumerate.outputs.names }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/nix-setup
        with:
          cachix-cache: ${{ vars.CACHIX_CACHE }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Evaluate every flake output
        run: nix flake check --no-build
      - name: Enumerate the checks to fan out over
        id: enumerate
        run: |
          set -euo pipefail
          names="$(nix eval --json '.#lib.x86_64-linux.ciCheckNames')"
          echo "fanning out over: $names"
          printf 'names=%s\n' "$names" >> "$GITHUB_OUTPUT"

  # One runner per check. These used to share a single four-core runner, where
  # Nix could only interleave them; giving each its own runner turns the sum of
  # their build times into the maximum of them.
  #
  # `fail-fast: false` so that a formatting failure does not cancel the test run
  # and hide a second, unrelated failure behind it.
  #
  # The timeout is back to 30 minutes, and it is a different 30 minutes than
  # the one that used to be too tight. It now bounds a single check rather than
  # all of them in sequence: the slowest here was 7m20s on a cache that had
  # never seen this commit's derivations, so 30 leaves a 4x margin while still
  # cutting a genuinely hung build off well short of an hour.
  check:
    name: Verify (${{ matrix.check }})
    needs: plan
    timeout-minutes: 30
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check: ${{ fromJSON(needs.plan.outputs.checks) }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/nix-setup
        with:
          cachix-cache: ${{ vars.CACHIX_CACHE }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Build the check
        run: nix build --no-link --print-build-logs ".#checks.x86_64-linux.${{ matrix.check }}"

  supply-chain:
    name: Supply-chain audit
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/nix-setup
        with:
          cachix-cache: ${{ vars.CACHIX_CACHE }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Reject vulnerable or unmaintained dependencies
        run: nix develop --command cargo audit --deny warnings

  # Benchmarks the merge base and this branch on the *same runner, minutes
  # apart*, and fails on a regression beyond the threshold.
  #
  # Comparing against a stored number would not work. Criterion's absolute
  # values are a property of the machine as much as of the code — a different
  # runner model, a noisy neighbour, or thermal state moves them by tens of
  # percent — so a gate built on remembered numbers fires constantly and means
  # nothing. Two revisions measured back to back on one runner is the only
  # comparison that survives that, and it is what scripts/bench-compare.sh
  # arranges.
  #
  # `continue-on-error` on purpose: a performance regression is information for
  # the reviewer, not grounds for blocking a correctness fix. The job's failure
  # is visible in the checks list without gating the merge.
  #
  # The timeout was 45 minutes when the job took 18, because two full workspace
  # builds under fat LTO and one codegen unit accounted for roughly 800 of its
  # 1082 seconds. `[profile.bench]` in Cargo.toml stopped that: the same two
  # builds are now parallel rather than serial, which on a four-core runner is
  # a 4x difference. A job that used to be the longest in this workflow — it
  # set the wall clock of every pull request single-handed — should not still
  # be allowed to run for three quarters of an hour before anyone notices it
  # hung. 20 leaves better than 3x headroom over the measured cost.
  benchmark:
    name: Benchmark against the merge base
    if: github.event_name == 'pull_request'
    timeout-minutes: 20
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
          # The full history: the script needs the merge base as a real
          # revision it can check out into a worktree.
          fetch-depth: 0
      - uses: ./.github/actions/nix-setup
        with:
          cachix-cache: ${{ vars.CACHIX_CACHE }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Compare this branch against its merge base
        run: |
          set -uo pipefail
          base="$(git merge-base HEAD "origin/${{ github.base_ref }}")"
          echo "merge base: $base"
          REPORT="$RUNNER_TEMP/bench-report.md" nix develop --command ./scripts/bench-compare.sh "$base"
          status=$?
          if [ -f "$RUNNER_TEMP/bench-report.md" ]; then
            cat "$RUNNER_TEMP/bench-report.md" >>"$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"
