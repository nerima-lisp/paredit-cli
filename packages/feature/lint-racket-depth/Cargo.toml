[package]
name = "paredit-feature-lint-racket-depth"
description = "Lint rules for Racket's own surface — match, contract-out, for comprehensions, and the single-form wrappers Scheme rules cannot reach"
readme = "README.md"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
paredit-core-syntax = { path = "../../core/syntax" }
paredit-core-lint-engine = { path = "../../core/lint-engine" }
paredit-core-cli = { path = "../../core/cli" }
serde_json.workspace = true

# Mandatory: without it this package silently opts out of the workspace lint
# table, including `unsafe_code = "deny"`, with no error at all.
[lints]
workspace = true
