[package]
name = "paredit-feature-lint-macro-authoring"
description = "Lint rules for Common Lisp macro authoring correctness: lambda-list markers, expander evaluation context and compiler-macro congruence"
readme = "README.md"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
paredit-core-syntax = { path = "../../core/syntax" }
paredit-core-lint-engine = { path = "../../core/lint-engine" }
paredit-core-cli = { path = "../../core/cli" }
serde_json.workspace = true

# Mandatory: without it this package silently opts out of the workspace lint
# table, including `unsafe_code = "deny"`, with no error at all.
[lints]
workspace = true
