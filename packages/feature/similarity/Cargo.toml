[package]
name = "paredit-feature-similarity"
description = "Similarity and duplicate reporting over workspace forms"
readme = "README.md"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
paredit-core-syntax = { path = "../../core/syntax" }
paredit-core-workspace = { path = "../../core/workspace" }
paredit-core-cli = { path = "../../core/cli" }
paredit-core-safety = { path = "../../core/safety" }
blake3.workspace = true
clap.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
proptest.workspace = true

# Mandatory: without it this package silently opts out of the workspace lint
# table, including `unsafe_code = "deny"`, with no error at all.
[lints]
workspace = true
