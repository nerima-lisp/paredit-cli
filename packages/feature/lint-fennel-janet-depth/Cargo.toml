[package]
name = "paredit-feature-lint-fennel-janet-depth"
description = "Depth pass for Fennel and Janet: rules transcribed from fennel-ls, Fennel's linter plugin, and Janet's own compiler lints"
readme = "README.md"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
paredit-core-syntax = { path = "../../core/syntax" }
paredit-core-lint-engine = { path = "../../core/lint-engine" }

# Mandatory: without it this package silently opts out of the workspace lint
# table, including `unsafe_code = "deny"`, with no error at all.
[lints]
workspace = true
