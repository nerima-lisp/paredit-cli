name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # Create the GitHub Release.
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      # Enforces the org invariant "git tag == version" at the only point
      # where it can still be corrected cheaply. paredit-cli has no .asd file,
      # so Cargo.toml's `version` is the single source of truth here instead.
      - name: Verify tag matches Cargo.toml version
        run: |
          set -euo pipefail
          cargo_version="$(sed -n 's/^version = "\([^"]*\)".*/\1/p' Cargo.toml | head -n1)"
          tag_version="${GITHUB_REF_NAME#v}"
          echo "cargo=$cargo_version tag=$tag_version"
          if [[ "$cargo_version" != "$tag_version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Cargo.toml version $cargo_version" >&2
            exit 1
          fi

      - uses: ./.github/actions/nix-setup
        with:
          cachix-cache: ${{ vars.CACHIX_CACHE }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      # Never publish a release that does not pass its own test suite.
      - name: Verify the tagged tree
        run: nix flake check --print-build-logs

      # Extracts this version's CHANGELOG section as the release body. Requires
      # the Keep a Changelog heading format `## [X.Y.Z] - YYYY-MM-DD`.
      - name: Extract release notes
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [[ ! -s release-notes.md ]]; then
            echo "::error::CHANGELOG.md has no section for [$version]" >&2
            exit 1
          fi

      # Every `uses:` in this org references a 40-character SHA, never a mutable
      # tag. Re-resolve before bumping, and do not copy a SHA you have not
      # resolved yourself:
      #   gh api repos/softprops/action-gh-release/git/ref/tags/v2 --jq .object.sha
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          body_path: release-notes.md
