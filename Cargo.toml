[package]
name = "paredit-cli"
version = "1.1.0"
edition = "2024"
publish = false
rust-version = "1.85"
license = "MIT"
description = "Structure-editing CLI for safe S-expression refactoring by AI coding agents"
repository = "https://github.com/nerima-lisp/paredit-cli"
homepage = "https://github.com/nerima-lisp/paredit-cli"
documentation = "https://nerima-lisp.github.io/paredit-cli/"
readme = "README.md"
keywords = ["lisp", "paredit", "refactoring", "cli", "sexp"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "paredit"
path = "src/main.rs"

[profile.release]
lto = "fat"
codegen-units = 1

[dependencies]
anyhow = "1.0"
blake3 = "1.8"
cap-std = "4.0"
clap = { version = "4.6", features = ["derive"] }
clap_complete = "4.5"
libc = "0.2"
serde_json = "1.0"
thiserror = "2.0"

[target.'cfg(unix)'.dependencies]
xattr = "1.6"

[dev-dependencies]
assert_cmd = "2.2"
criterion = "0.5.1"
predicates = "3.1"
proptest = "1.11"

[[bench]]
name = "similarity_report"
harness = false

[[bench]]
name = "lint_report"
harness = false

[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[lints.clippy]
all = "warn"
