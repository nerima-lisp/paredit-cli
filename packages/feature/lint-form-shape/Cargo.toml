[package]
name = "paredit-feature-lint-form-shape"
description = "Lint rules for form shape: assignment, quoting, lambda, keywords, arity and defaults"
readme = "README.md"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
paredit-core-syntax = { path = "../../core/syntax" }
paredit-core-semantics = { path = "../../core/semantics" }
paredit-core-lint-engine = { path = "../../core/lint-engine" }
paredit-core-workspace = { path = "../../core/workspace" }
paredit-core-cli = { path = "../../core/cli" }
# One feature edge: the lambda-list parameter reader.
paredit-feature-function-parameter = { path = "../function-parameter" }
anyhow.workspace = true
clap.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
proptest.workspace = true

# Mandatory: without it this package silently opts out of the workspace lint
# table, including `unsafe_code = "deny"`, with no error at all.
[lints]
workspace = true
