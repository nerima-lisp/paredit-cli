[package]
name = "paredit-feature-project-analysis"
description = "Project-wide analysis: call graphs, cycles, impact, signatures and workspace reports"
readme = "README.md"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
paredit-core-syntax = { path = "../../core/syntax" }
paredit-core-semantics = { path = "../../core/semantics" }
paredit-core-edit = { path = "../../core/edit" }
paredit-core-workspace = { path = "../../core/workspace" }
paredit-core-cli = { path = "../../core/cli" }
# Feature-to-feature edges (section 2.2 measured 89 of them).
paredit-feature-package = { path = "../package" }
paredit-feature-remove-unused = { path = "../remove-unused" }
clap.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
proptest.workspace = true

# Mandatory: without it this package silently opts out of the workspace lint
# table, including `unsafe_code = "deny"`, with no error at all.
[lints]
workspace = true
