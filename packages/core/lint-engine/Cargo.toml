[package]
name = "paredit-core-lint-engine"
description = "The lint rule contract and the single pass that runs a rule set"
readme = "README.md"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
paredit-core-syntax = { path = "../syntax" }
paredit-core-semantics = { path = "../semantics" }
# The wall-clock budget the walk checks between nodes. One rule over one
# pathological file is the only place a lint run can become unbounded.
paredit-core-safety = { path = "../safety" }
# No anyhow. A lint rule's only legitimate failure is a path that does not
# resolve or a budget that ran out, and LintError says so; see src/error.rs.
thiserror.workspace = true

[dev-dependencies]
proptest.workspace = true

# Mandatory: without it this package silently opts out of the workspace lint
# table, including `unsafe_code = "deny"`, with no error at all.
[lints]
workspace = true
