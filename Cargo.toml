[package]
name = "paredit-cli"
version = "1.4.0"
edition = "2024"
publish = false
rust-version = "1.85"
license = "MIT"
description = "Structure-editing CLI for safe S-expression refactoring by AI coding agents"
repository = "https://github.com/nerima-lisp/paredit-cli"
homepage = "https://github.com/nerima-lisp/paredit-cli"
documentation = "https://nerima-lisp.github.io/paredit-cli/"
readme = "README.md"
keywords = ["lisp", "paredit", "refactoring", "cli", "sexp"]
categories = ["command-line-utilities", "development-tools"]

# `bench = false` on both, so `cargo bench -- <criterion args>` reaches the
# Criterion targets. Cargo benches every target whose `bench` flag is true,
# including the library and the binary, and their default libtest harness has
# no benchmarks to run and rejects `--save-baseline` outright — which made
# `scripts/bench-compare.sh` fail before it measured anything.
[lib]
bench = false

[[bin]]
name = "paredit"
path = "src/main.rs"
bench = false

[profile.release]
lto = "fat"
codegen-units = 1

# Without a `[profile.bench]`, `cargo bench` inherits `[profile.release]` — so
# every benchmark run rebuilt the whole workspace under fat LTO and one codegen
# unit, and `scripts/bench-compare.sh` does that twice, once per revision. In
# the CI benchmark job that was roughly 800 of its 1082 seconds; the actual
# measuring was about 200.
#
# Those two settings are not merely expensive, they are *serial*. Cold builds of
# the two Criterion targets, at the four-way parallelism a GitHub runner has:
#
#   lto = "fat",  codegen-units = 1    523s wall, 578s user   <- 1.1x parallel
#   lto = "thin", codegen-units = 16   174s wall, 627s user
#   lto = false,  codegen-units = 16   137s wall, 497s user
#   lto = "thin", codegen-units = 4    128s wall, 470s user
#
# One codegen unit behind a whole-program LTO pass leaves three of the runner's
# four cores idle for the entire build.
#
# Fat LTO earns that cost in the binary that ships. It earns nothing here. The
# gate compares two revisions built the same way on the same machine minutes
# apart, so what it needs from the profile is that both sides receive the
# *same* optimisation — not the last few percent of it. Thin LTO still inlines
# across crate boundaries, which matters because the benchmarked paths run from
# `paredit_cli::application` down into the core packages: `lto = false` is
# faster still, and it would change what is being measured. Four codegen units
# beat sixteen on four cores because fewer, larger units duplicate less
# inlining work — and, being larger, optimise slightly better besides.
[profile.bench]
lto = "thin"
codegen-units = 4

# The dev profile is what `clippy --all-targets` and `cargo nextest run` build,
# in CI and locally. Full DWARF for 25 member crates plus the ~240-module
# `tests/cli.rs` integration binary dominates link time and buys nothing that a
# panic backtrace uses: line tables still resolve every frame to `file:line`,
# which is the only debug information the test suite ever reports from.
# Step-debugging a specific crate is still available with `RUSTFLAGS=-Cdebuginfo=2`.
[profile.dev]
debug = "line-tables-only"

# PR-only fast path for the `treefmt-pr-check` and
# `lint-format-integration-pr-check` Nix checks (see flake.nix): they need a
# *working* paredit binary to run its formatter/lint plugin, not the exact
# binary that ships. `package` (main/release) keeps building under
# `[profile.release]`'s fat LTO unchanged; this profile never touches it.
# Measured on this workspace at four cores (matching a GitHub runner):
# thin-LTO/4 cold full-workspace release build took 160s, against fat-LTO's
# ~14min in CI — see [profile.bench] above for the same settings' cost on the
# smaller Criterion targets.
[profile.pr-check]
inherits = "release"
lto = "thin"
codegen-units = 4

